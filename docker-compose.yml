services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hookymaster
      POSTGRES_PASSWORD: hookymaster
      POSTGRES_DB: hookymaster
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookymaster"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://hookymaster:hookymaster@db:5432/hookymaster?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
